    <script type="text/javascript">

      var gameInstance;

      function startGame() {
        const playButton = document.getElementById("run_game");
        const gameStatus = document.getElementById("game-status");

        if (!window.UnityLoader || typeof window.UnityLoader.instantiate !== "function") {
          gameStatus.textContent = "The game loader did not load. Check your connection and reload.";
          return;
        }

        playButton.disabled = true;
        playButton.textContent = "Loading game...";

        try {
          gameInstance = UnityLoader.instantiate("gameContainer", "https://cdn.jsdelivr.net/gh/ferialoken937373/clever@8424f74721ca8bb284b77c2b9f232b94171fe2e2/projects/rockpaperscissors/exercise/2.7.json", {
            onProgress: UnityProgress,
            Module: {
              onRuntimeInitialized: function () {
                UnityProgress(gameInstance, "complete");
                playButton.remove();
                gameStatus.textContent = "";
              }
            }
          });
        } catch (error) {
          console.error("Unable to start the game.", error);
          playButton.disabled = false;
          playButton.textContent = "Try again";
          gameStatus.textContent = "The game could not start. Check your connection and try again.";
        }
      }
    </script>
