<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
	<base href="https://cdn.jsdelivr.net/gh/rz-6-5-z/bsrandm@main/">
	<title>Basket Random</title>
	<link rel="manifest" href="appmanifest.html">
	<link rel="stylesheet" href="style.css">
	<script>
		window.addEventListener("keydown", function (event) {
			if (event.key.toLowerCase() === "f") {
				if (document.fullscreenElement) {
					document.exitFullscreen();
				} else {
					document.documentElement.requestFullscreen();
				}
				return;
			}

			if ([32, 37, 38, 39, 40].includes(event.keyCode)) {
				event.preventDefault();
			}
		}, false);
	</script>
</head>
<body>
	<div id="fb-root"></div>
	<script src="box2d.wasm.js"></script>
	<noscript>
		<div id="notSupportedWrap">
			<h2 id="notSupportedTitle">This content requires JavaScript</h2>
			<p class="notSupportedMessage">Please enable JavaScript to play Basket Random.</p>
		</div>
	</noscript>
	<script src="scripts/supportcheck.js"></script>
	<script src="scripts/offlineclient.js"></script>
	<script src="scripts/main.js"></script>
	<script src="scripts/register-sw.js"></script>
</body>
</html>
